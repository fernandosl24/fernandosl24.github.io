<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faculty Training</title><style>html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8f6f2;color:#171717}.loading{height:100%;display:grid;place-items:center}.loading div{text-align:center}.loading strong{display:block;font-size:18px;margin-bottom:8px}.loading span{font-size:13px;color:#70747b}</style></head><body><div class="loading"><div><strong>Loading Faculty Training…</strong><span>Please wait a moment.</span></div></div><script>(async()=>{try{const parts=['payload-00.txt','payload-01.txt','payload-02.txt'];const data=(await Promise.all(parts.map(p=>fetch(p).then(r=>{if(!r.ok)throw new Error('Unable to load '+p);return r.text()})))).join('');const bin=atob(data);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading"><div><strong>Unable to load this page</strong><span>'+e.message+'</span></div></div>'}})();</script></body></html>
