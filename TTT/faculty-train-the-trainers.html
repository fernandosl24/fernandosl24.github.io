<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Faculty Train the Trainers</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f7f5f1;color:#171717}.gate{min-height:100%;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);background:#fff;border:1px solid #e7e3de;border-radius:24px;padding:32px;box-shadow:0 18px 50px rgba(0,0,0,.06)}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#777}.card h1{font-size:32px;letter-spacing:-.04em;margin:10px 0 10px}.card p{color:#656565;line-height:1.55;font-size:14px}.field{display:flex;gap:8px;margin-top:22px}.field input{flex:1;min-width:0;border:1px solid #d9d5cf;border-radius:12px;padding:13px 14px;font-size:15px;outline:none}.field input:focus{border-color:#171717}.field button{border:0;border-radius:12px;background:#171717;color:#fff;padding:0 18px;font-weight:700;cursor:pointer}.error{min-height:20px;margin-top:12px;color:#b42318;font-size:13px}.loading{min-height:100%;display:grid;place-items:center;text-align:center}.loading strong{display:block;font-size:18px;margin-bottom:8px}.loading span{font-size:13px;color:#70747b}</style></head><body><main id="app" class="gate"><div class="card"><div class="eyebrow">Protected training material</div><h1>Faculty Train the Trainers</h1><p>Enter the password shared with you to open this document.</p><form id="form" class="field"><input id="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required><button type="submit">Open</button></form><div id="error" class="error" role="alert"></div></div></main><script>const EXPECTED_HASH='af11f4e4d4a5172cebd0c107caa23ac558f7fe4d50e3495bcded6237bd4a4d4f';const parts=['payload-00.txt','payload-01.txt','payload-02.txt'];const enc=new TextEncoder();function hex(buf){return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}async function unlock(password){const hash=hex(await crypto.subtle.digest('SHA-256',enc.encode(password)));if(hash!==EXPECTED_HASH)throw new Error('Incorrect password.');sessionStorage.setItem('ttt-access','1');document.getElementById('app').outerHTML='<main class="loading"><div><strong>Loading Faculty Training…</strong><span>Please wait a moment.</span></div></main>';const data=(await Promise.all(parts.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Unable to load training content.');return r.text()})))).join('');const bin=atob(data);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream' in window))throw new Error('This browser does not support the document loader. Please use a current version of Chrome, Edge, Safari, or Firefox.');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('error');error.textContent='';const pwd=document.getElementById('password').value;try{await unlock(pwd)}catch(err){error.textContent=err.message;document.getElementById('password')?.focus()}});</script></body></html>
