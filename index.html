<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Fernando's Public Pages</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f8;
      color: #1f2328;
    }
    main {
      width: min(560px, 100%);
      padding: 40px;
      background: white;
      border: 1px solid #d8dee4;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(31, 35, 40, 0.06);
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 0; line-height: 1.6; color: #59636e; }
  </style>
</head>
<body>
  <main>
    <h1>Fernando's Public Pages</h1>
    <p>This site is used to host individual public pages and documents shared by Fernando.</p>
  </main>
</body>
</html>
